name: Serenity WAVETABLE — Native Interactive 3D UI Builds

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: serenity-native-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS-ARM64
          - runner: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout pinned v1.2.10 A/B baseline
        uses: actions/checkout@v4
        with:
          ref: b6a9382bc3d7f8ed3c2b7228936b1f8f4353cd07
          path: baseline-v1210

      - name: Set up Python for paired benchmark
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure JUCE 8
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macOS-ARM64" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build -A x64
          fi

      - name: Build AU / VST3 / Standalone
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Test native vector editor, all pages and live pixel updates
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Paired A/B comparison versus v1.2.10 on the same runner
        shell: bash
        run: python ci/compare_hd_ab.py build

      - name: Publish HD quality-control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-WAVETABLE-v1.2.11-HD-Quality-${{ matrix.platform }}
          path: |
            build/hd-quality.csv
            build/hd-quality-summary.txt
            build/hd-ab-summary.csv
            build/hd-ab-summary.md
            build/hd-ab-trials.csv
            build/hd-simd-study.txt
            build/hd-unison-engine-benchmark.csv
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish real rendered UI screenshot previews
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-WAVETABLE-v1.2.11-UI-Previews
          path: build/Serenity-UI-Preview-*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish untouched reference UI images for comparison
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-WAVETABLE-v1.2.11-Original-References
          path: Assets/UI/skin_*.png
          if-no-files-found: error
          retention-days: 30

      - name: Verify built plugin folders
        shell: bash
        run: |
          test -d build/SerenityWavetable_artefacts/Release/VST3
          test -d build/SerenityWavetable_artefacts/Release/Standalone
          if [ "${{ matrix.platform }}" = "macOS-ARM64" ]; then
            test -d build/SerenityWavetable_artefacts/Release/AU
          fi

      - name: Package macOS AU VST3 Standalone
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/Serenity-WAVETABLE-macOS-ARM64
          cp -R build/SerenityWavetable_artefacts/Release/AU dist/Serenity-WAVETABLE-macOS-ARM64/
          cp -R build/SerenityWavetable_artefacts/Release/VST3 dist/Serenity-WAVETABLE-macOS-ARM64/
          cp -R build/SerenityWavetable_artefacts/Release/Standalone dist/Serenity-WAVETABLE-macOS-ARM64/
          ditto -c -k --sequesterRsrc --keepParent dist/Serenity-WAVETABLE-macOS-ARM64 \
            dist/Serenity-WAVETABLE-v1.2.11-macOS-ARM64.zip

      - name: Package Windows VST3 Standalone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist/Serenity-WAVETABLE-Windows-x64' | Out-Null
          Copy-Item -Recurse 'build/SerenityWavetable_artefacts/Release/VST3' 'dist/Serenity-WAVETABLE-Windows-x64/'
          Copy-Item -Recurse 'build/SerenityWavetable_artefacts/Release/Standalone' 'dist/Serenity-WAVETABLE-Windows-x64/'
          Compress-Archive -Path 'dist/Serenity-WAVETABLE-Windows-x64' -DestinationPath 'dist/Serenity-WAVETABLE-v1.2.11-Windows-x64.zip' -Force

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-WAVETABLE-v1.2.11-Original-UI-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

# Unsigned development binaries. Commercial signing/notarization is not configured.
