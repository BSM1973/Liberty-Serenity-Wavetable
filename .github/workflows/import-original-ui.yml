name: Serenity — Restore exact original user UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-original-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-original-screens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owned Serenity repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12 and lossless image decoding
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Restore exact 10 original PNG assets and source files
        run: python tools/bootstrap_original_ui.py

      - name: Commit only verified original assets and native JUCE source
        run: |
          git config user.name "Serenity Original UI Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Restore original Serenity 10-page UI (pixel-verified 2048x1361)"
            git push origin HEAD:main
          fi
